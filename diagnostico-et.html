<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostika ja tegevuskava</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#2f4a2a;--s:#6d8a5a;--s2:#dfe8d5;--c:#fbf7ef;--c2:#f3ebdd;--o:#b8924a;--t:#2a2a24;--m:#6b6a5e;--w:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:var(--c);color:var(--t);line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
header{text-align:center;padding:18px 0 10px}
.tag{display:inline-block;background:var(--s);color:#fff;font-weight:800;font-size:12px;letter-spacing:3px;padding:6px 16px;border-radius:30px}
h1{font-family:'Fraunces',serif;font-weight:800;color:var(--g);font-size:clamp(28px,6vw,40px);line-height:1.1;margin:14px 0 8px}
h1 em{font-style:normal;color:var(--o)}
.sub{color:var(--m);max-width:560px;margin:0 auto}
.bar{height:8px;background:var(--c2);border-radius:9px;margin:22px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--s),var(--o));transition:width .3s}
.step-n{font-size:13px;color:var(--m);text-align:right;font-weight:600}
.card{background:var(--w);border:1px solid #e6dfcf;border-radius:18px;padding:24px 20px;margin-top:14px;box-shadow:0 6px 20px rgba(47,74,42,.06)}
.q{display:none}.q.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.q h2{font-family:'Fraunces',serif;color:var(--g);font-size:22px;line-height:1.25;margin-bottom:6px}
.q .hint{color:var(--m);font-size:14px;margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid #e2dac9;border-radius:14px;padding:13px 14px;cursor:pointer;background:var(--c);font-weight:600;transition:.15s}
.opt:hover{border-color:var(--s)}
.opt input{accent-color:var(--g);width:18px;height:18px;flex:none}
.opt.sel{border-color:var(--g);background:var(--s2)}
.opt small{display:block;font-weight:400;color:var(--m);font-size:13px}
input[type=text],input[type=number],select{width:100%;font:inherit;padding:13px 14px;border:1.5px solid #e2dac9;border-radius:12px;background:var(--c);color:var(--t)}
input:focus,select:focus{outline:2px solid var(--s);border-color:var(--s)}
.row{display:grid;grid-template-columns:1fr 130px;gap:10px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
button{font:800 15px 'Nunito Sans',sans-serif;border:0;border-radius:40px;padding:14px 22px;cursor:pointer}
.next{background:var(--g);color:#fff;flex:1}.next:disabled{opacity:.4;cursor:not-allowed}
.back{background:transparent;color:var(--g);border:1.5px solid var(--g)}
.err{color:#b5654a;font-size:13px;margin-top:8px;min-height:18px}
/* Resultado */
#plan{display:none}
.hero{background:linear-gradient(135deg,var(--g),#466b3c);color:#fff;border-radius:20px;padding:26px 22px;margin-top:10px}
.hero .k{font-size:12px;letter-spacing:3px;font-weight:800;color:#e9d8b0}
.hero h2{font-family:'Fraunces',serif;font-size:28px;line-height:1.15;margin:6px 0}
.hero p{opacity:.92}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:rgba(255,255,255,.12);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:'Fraunces',serif;font-size:22px}
.stat span{font-size:12px;opacity:.9}
.sec{margin-top:22px}
.sec h3{font-family:'Fraunces',serif;color:var(--g);font-size:21px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.sec h3 .n{background:var(--o);color:#fff;font:800 13px 'Nunito Sans';border-radius:30px;padding:3px 10px}
.list{list-style:none;display:grid;gap:8px}
.list li{background:var(--w);border:1px solid #e6dfcf;border-radius:12px;padding:11px 14px 11px 40px;position:relative}
.list li:before{content:"✓";position:absolute;left:14px;top:10px;color:var(--s);font-weight:800}
.list.warn li:before{content:"!";color:#b5654a}
.week{background:var(--w);border:1px solid #e6dfcf;border-radius:16px;padding:16px;margin-bottom:12px;break-inside:avoid}
.week h4{color:var(--g);font-size:16px;margin-bottom:2px}
.week .d{font-size:12px;color:var(--o);font-weight:800;letter-spacing:2px}
.week ul{margin:8px 0 0 0;list-style:none}
.week li{padding:6px 0 6px 28px;border-top:1px dashed #e6dfcf;position:relative;font-size:15px}
.week li:before{content:"☐";position:absolute;left:4px;color:var(--s);font-weight:800}
.week li b{color:var(--g)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--s2);color:var(--g);font-weight:800;font-size:13px;border-radius:30px;padding:6px 12px}
.note{background:#fdf8ee;border-left:4px solid var(--o);border-radius:12px;padding:14px 16px;font-size:14px;color:var(--m);margin-top:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.actions button{flex:1;min-width:200px}
.print{background:var(--o);color:#fff}
.restart{background:transparent;border:1.5px solid var(--g);color:var(--g)}
@media (max-width:520px){.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}.wrap{max-width:none;padding:0}
  #quiz,header .sub,.actions,.bar,.step-n{display:none!important}
  header{padding:0}
  .hero{break-inside:avoid}
  .sec{break-inside:auto}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="tag">PROGRAMMI 1. SAMM</span>
  <h1>Isiklik <em>diagnostika ja tegevuskava</em></h1>
  <p class="sub">Vasta 12-le kiirele küsimusele (umbes 5 minutit). Lõpus saad 30-päevase plaani, mis on kohandatud sinu ajale, eelarvele ja kogemustele, valmis printimiseks või PDF-ina salvestamiseks.</p>
</header>

<div id="quiz">
  <div class="bar"><i id="prog"></i></div>
  <div class="step-n" id="stepn"></div>
  <div class="card" id="qs"></div>
  <div class="err" id="err"></div>
  <div class="nav">
    <button class="back" id="back" type="button">← Tagasi</button>
    <button class="next" id="next" type="button">Järgmine →</button>
  </div>
</div>

<div id="plan"></div>
</div>

<script>
const Q = [
 {id:"nombre", t:"Mis su nimi on?", h:"Sinu plaan kannab sinu nime.", type:"text", ph:"Sinu nimi"},
 {id:"pais", t:"Millises riigis sa müüd?", h:"See aitab meil soovitada kanaleid ja olulisi kuupäevi.", type:"select",
  o:["Eesti","Soome","Läti","Leedu","Venemaa","Rootsi","Muud"]},
 {id:"exp", t:"Kui palju kogemust sul on gurmeekapslite valmistamisel?", type:"radio", o:[
   ["0","Ma pole veel ühtegi teinud","Olen kursusega just alustamas"],["1","Olen teinud katseid","Tulemus tuleb, aga harjutan veel"],
   ["2","Olen juba müünud või kinkinud mõningaid","Mul on kogemust ja tagasisidet"],["3","Müüngi regulaarselt","Soovin korrastada ja kasvada"]]},
 {id:"pres", t:"Millise eelarvega alustad materjalide ja pakendite jaoks?", type:"radio", o:[
   ["0","Väga madal","Kasutan vaid olemasolevat või minimaalset"],["1","Madal","Paari partii ja lihtsate pakkide jaoks"],
   ["2","Keskmine","Mitme partii ja ilusate kastide jaoks"],["3","Võin rohkem investeerida","Uued vormid, rohkem pakendeid ja materjale"]]},
 {id:"horas", t:"Kui palju tunde nädalas saad sellele pühendada?", type:"radio", o:[
   ["0","Alla 3 tunni","Veidi mõned päevad"],["1","3 kuni 6 tundi","Peaaegu tund päevas"],
   ["2","7 kuni 12 tundi","Üks või kaks tundi päevas"],["3","Üle 12 tunni","Võin palju aega pühendada"]]},
 {id:"canales", t:"Kus sooviksid müüa?", h:"Võid valida mitu valikut.", type:"check", o:[
   ["wa","WhatsApp"],["ig","Instagram"],["tt","TikTok"],["fb","Facebook ja Marketplace"],["feria","Laatadel ja turgudel"],
   ["local","Kohalikud ettevõtted (kohvikud, lillepoed, kingitused)"],["eventos","Sündmused ja ettevõtted (pulmad, sünnipäevad, firmakingitused)"]]},
 {id:"contactos", t:"Kui palju kontakte sul WhatsAppis umbes on?", type:"radio", o:[
   ["0","Alla 100",""],["1","100 kuni 300",""],["2","300 kuni 800",""],["3","Üle 800",""]]},
 {id:"video", t:"Kas julged sotsiaalmeedias videoid teha?", type:"radio", o:[
   ["2","Jah, ja võin ise olla videos","Julgen kaamera ees rääkida"],["1","Jah, aga ainult käed ja toode","Eelistan mitte näidata nägu"],
   ["0","Eelistaksin praegu fotosid","Videod on mulle keerulised"]]},
 {id:"obj", t:"Mida soovid selle äriga saavutada?", type:"radio", o:[
   ["extra","Lisatulu","Täiendama olemasolevat sissetulekut"],["principal","Peamine sissetulek","Ehitan tõsist äri"],
   ["temporada","Müüa tähtpäevadel","Jõulud, emadepäev, sõbrapäev…"],["eventos","Spetsialiseeruda sündmustele ja kingitustele","Pulmad, sünnipäevad, ettevõtted"]]},
 {id:"meta", t:"Kui palju soovid järgmise 30 päeva jooksul müüa?", h:"Kirjuta number ja valuuta. Hiljem saad seda Kalkulaatoriga kohandada.", type:"meta"},
 {id:"traba", t:"Mis sind praegu kõige rohkem takistab?", type:"radio", o:[
   ["precio","Ma ei tea, kui palju küsida",""],["donde","Ma ei tea, kus ega kellele müüa",""],["verguenza","Mul on piinlik pakkuda",""],
   ["tiempo","Mul pole palju aega",""],["produccion","Ma ei tunne end tootmises veel kindlalt",""]]},
 {id:"fecha", t:"Milline tähtpäev on sul lähim?", h:"Tähtpäevad on sinu parim müügivõimalus.", type:"radio", o:[
   ["navidad","Jõulud ja uus aasta",""],["sanvalentin","Sõbrapäev / Armastuse päev",""],["madre","Emadepäev",""],
   ["padre","Isadepäev",""],["graduacion","Lõpupidu / koolilõpp",""],["ninguna","Mõni lähinädalatel pole",""]]},
];
const MONEDAS = {"Eesti":"EUR","Soome":"EUR","Läti":"EUR","Leedu":"EUR","Venemaa":"RUB","Rootsi":"SEK","Muud":"EUR"};
let A = {}; let i = 0;
try { const s = localStorage.getItem("cg_diag"); if (s) A = JSON.parse(s) || {}; } catch(e) {}
const save = () => { try { localStorage.setItem("cg_diag", JSON.stringify(A)); } catch(e) {} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render() {
  const q = Q[i]; let h = `<div class="q on"><h2>${q.t}</h2>${q.h ? `<p class="hint">${q.h}</p>` : ""}`;
  if (q.type === "text") h += `<input type="text" id="f" placeholder="${q.ph}" value="${esc(A[q.id]||"")}" maxlength="40">`;
  if (q.type === "select") h += `<select id="f"><option value="">Vali oma riik</option>${q.o.map(o=>`<option ${A[q.id]===o?"selected":""}>${o}</option>`).join("")}</select>`;
  if (q.type === "radio") h += `<div class="opts">${q.o.map(([v,l,s])=>`<label class="opt ${A[q.id]===v?"sel":""}"><input type="radio" name="r" value="${v}" ${A[q.id]===v?"checked":""}><span>${l}${s?`<small>${s}</small>`:""}</span></label>`).join("")}</div>`;
  if (q.type === "check") { const cur = A[q.id]||[]; h += `<div class="opts">${q.o.map(([v,l])=>`<label class="opt ${cur.includes(v)?"sel":""}"><input type="checkbox" value="${v}" ${cur.includes(v)?"checked":""}><span>${l}</span></label>`).join("")}</div>`; }
  if (q.type === "meta") { const mon = A.moneda || MONEDAS[A.pais] || "EUR";
    h += `<div class="row"><input type="number" id="f" min="0" inputmode="numeric" placeholder="Näiteks: 1000" value="${A.meta||""}"><input type="text" id="mon" value="${esc(mon)}" maxlength="5" aria-label="Valuuta"></div>`; }
  h += "</div>";
  $("#qs").innerHTML = h; $("#err").textContent = "";
  $("#prog").style.width = (i / Q.length * 100) + "%";
  $("#stepn").textContent = `Küsimus ${i+1} / ${Q.length}`;
  $("#back").style.visibility = i ? "visible" : "hidden";
  $("#next").textContent = i === Q.length - 1 ? "Vaata minu plaani ✦" : "Järgmine →";
  document.querySelectorAll(".opt input").forEach(inp => inp.addEventListener("change", () => {
    if (inp.type === "radio") { document.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel")); inp.closest(".opt").classList.add("sel"); A[q.id] = inp.value; save(); setTimeout(next, 220); }
    else { inp.closest(".opt").classList.toggle("sel", inp.checked); A[q.id] = [...document.querySelectorAll(".opt input:checked")].map(x=>x.value); save(); }
  }));
  const f = $("#f"); if (f && q.type !== "select") { f.focus(); f.addEventListener("keydown", e => { if (e.key === "Enter") next(); }); }
}
function valid() {
  const q = Q[i];
  if (q.type === "text") { const v = $("#f").value.trim(); if (!v) return "Kirjuta oma nimi, et jätkata."; A.nombre = v; }
  if (q.type === "select") { const v = $("#f").value; if (!v) return "Vali riik."; if (A.pais !== v) delete A.moneda; A.pais = v; }
  if (q.type === "radio" && A[q.id] === undefined) return "Vali üks valikutest.";
  if (q.type === "check" && !(A[q.id]||[]).length) return "Vali vähemalt üks valik.";
  if (q.type === "meta") { const v = parseFloat($("#f").value); if (!(v > 0)) return "Kirjuta number, mis on suurem kui null."; A.meta = v; A.moneda = ($("#mon").value.trim() || "EUR").toUpperCase(); }
  save(); return "";
}
function next() { const e = valid(); if (e) { $("#err").textContent = e; return; } if (i < Q.length - 1) { i++; render(); } else showPlan(); }
$("#next").onclick = next;
$("#back").onclick = () => { if (i > 0) { i--; render(); } };

const n = k => parseInt(A[k] ?? 0, 10);
const fmt = v => Math.round(v).toLocaleString("et");

function showPlan() {
  const exp = n("exp"), pres = n("pres"), horas = n("horas"), cont = n("contactos"), vid = n("video");
  const ch = A.canales || [], has = c => ch.includes(c);
  const nombre = esc(A.nombre), mon = esc(A.moneda), meta = A.meta;

  // Profiil
  const score = exp + horas + Math.min(pres, 2);
  const perfil = score <= 3 ? ["Algav ettevõtja", "Sinu prioriteet on harjutada, valmistada ilus proovipakk ja alustada müüki oma lähedaste seas. Samm-sammult."]
    : score <= 6 ? ["Tegutsev ettevõtja", "Sul on juba baas olemas. Prioriteediks on korrastada hinnad, näidata toodet järjepidevalt ja sulgeda esimesed tellimused."]
    : ["Kasvuks valmis ettevõtja", "Sul on kogemus ja aeg. Prioriteediks on lisada kanaleid, suured tellimused ja korduvad kliendid."];

  // Igapäevane aeg
  const minDia = ["20–30 min", "40–60 min", "1–2 h", "2 h või rohkem"][horas];
  const diasSem = [3, 5, 5, 6][horas];

  // Prioriteetsed kanalid
  let prio = ["WhatsApp (staatused ja isiklikud sõnumid)"];
  if (has("ig") || (vid >= 1 && !has("tt"))) prio.push(vid >= 1 ? "Instagram (Reels ja staatused)" : "Instagram (fotod ja karussell)");
  if (has("tt") && vid >= 1) prio.push("TikTok (lühikesed protsessivideod)");
  if (has("fb")) prio.push("Facebook Marketplace ja kohalikud grupid");
  if (has("local")) prio.push("Kohalikud partnerettevõtted");
  if (has("eventos") || A.obj === "eventos") prio.push("Sündmused ja firmakingitused");
  if (has("feria")) prio.push("Laadad ja turud");
  prio = [...new Set(prio)].slice(0, horas >= 2 ? 4 : 3);

  // Soovitatud tooted
  const prods = exp === 0 ? ["Proovikarp (4 gurmeekapslit)", "Kingituse karp (6 gurmeekapslit)"]
    : ["Proovikarp (4 gurmeekapslit)", "Kingituse karp (6–9 gurmeekapslit)", "Kohandatud tellimus"];
  if (A.obj === "eventos" || has("eventos")) prods.push("Sündmuste meenutused (koguse alusel)");
  const formatos = exp <= 1 ? "süda, lill ja ring (kergesti vormist eemaldatavad)" : "süda, lill, karu ja liblikas";
  const sabores = pres === 0 ? "2 kohvisorti ja 1 tee maitse, et osta vähe materjale" : "3 kohvisorti ja 2 tee maitset";

  // Tähtpäev
  const F = {navidad:["Jõulukarp","Jõulud"], sanvalentin:["Armastajate karp","Sõbrapäev"], madre:["Emadepäeva karp","emadepäev"],
             padre:["Isadepäeva karp","isadepäev"], graduacion:["Lõpukarp","lõpupidustused"], ninguna:["Sünnipäevakarbid","kuu sünnipäevad"]};
  const [cajaT, fechaT] = F[A.fecha] || F.ninguna;

  // Eesmärgid (keskmist hinda ei teata: palutakse arvutada)
  const metaSem = meta / 4.3;

  // Tugevused ja tähelepanu
  const fort = [], aten = [];
  if (exp >= 2) fort.push("Sul on juba kogemus: võid alates esimesest päevast näidata päris fotosid ja tagasisidet.");
  if (horas >= 2) fort.push("Sul on piisavalt aega: saad plaanist kiiremini edasi liikuda.");
  if (cont >= 2) fort.push("Sinu WhatsAppi kontaktide nimekiri on suur: staatused on sinu esimene müügikanal.");
  if (vid === 2) fort.push("Julged videos olla: see tekitab usaldust ja müüb paremini.");
  if (pres >= 2) fort.push("Sinu eelarve võimaldab algusest peale hoolitseda esituse eest.");
  if (A.fecha && A.fecha !== "ninguna") fort.push(`Sul on lähenev tähtpäev: ${fechaT}, mis õigustab ostmist juba praegu.`);
  if (!fort.length) fort.push("Oled astunud sammu ja alustanud meetodiga: see paneb sind enamikust ettepoole.");
  if (exp <= 1) aten.push("Harjuta 2–3 partiid enne suurte tellimuste vastuvõtmist; alusta lihtsate vormidega.");
  if (pres === 0) aten.push("Alusta lihtsate pakkidega (kraft-kott + silt) ja reinvesteeri esimesed tulud kastidesse.");
  if (horas === 0) aten.push("Vähe aega? Tootmine ühel päeval nädalas ja mitu videot korraga salvestades.");
  if (cont === 0) aten.push("Kontaktide nimekiri on väike: vajad Marketplace'i, gruppe ja partnerettevõtteid, et jõuda rohkemate inimesteni.");
  if (vid === 0) aten.push("Ilma videota jõuad vähemate inimesteni. Proovi ainult kätega: lahustuv kapsel on sinu parim sisu.");
  const TRABA = {precio:"Suurim takistus on hind: 3. ja 4. päev on võtmetähtsusega. Ära jäta neid vahele.",
    donde:"Suurim takistus on müügikoht: järgi juhendit oma esimese 10 kliendi leidmiseks alates 7. päevast.",
    verguenza:"Sul on piinlik pakkuda: kasuta valmis sõnumeid Boonus 1-st. Jagad midagi ilusat, mitte ei palu teenet.",
    tiempo:"Sinu aeg on piiratud: tee iga päeva põhitegevus ja koonda tootmine.",
    produccion:"Sa ei tunne end tootmises veel kindlalt: pühenda 2. ja 6. päev harjutamisele ja korda põhikursust."};
  aten.push(TRABA[A.traba]);

  // Isikupärastatud nädalad
  const S1 = [
    `<b>1. päev:</b> prindi see plaan välja ja kirjuta, miks alustad.`,
    `<b>2. päev:</b> määra oma menüü: ${prods.slice(0,3).join(", ")}. Vormid: ${formatos}. Maitsed: ${sabores}.`,
    `<b>3.–4. päev:</b> sisesta kulud Kalkulaatorisse ja määra hinnad (soovituslik marginaal: 55–70 %).`,
    `<b>5. päev:</b> pane oma eesmärk lehele «3 · Eesmärk»: ${fmt(meta)} ${mon} tähendab umbes ${fmt(metaSem)} ${mon} nädalas. Vaata, mitu karpi see tähendab ja kohanda vajadusel.`,
    exp <= 1 ? `<b>6. päev:</b> tee 2 harjutuspartiid ja üks proovikarp. Tee 15 pilti loomulikus valguses.` : `<b>6. päev:</b> valmista proovikarp, tee 15 pilti ja salvesta kapsli lahustumise video.`,
    `<b>7. päev:</b> seadista WhatsApp Business (tootekataloog) ja koosta nimekiri ${cont === 0 ? "50" : "100"} kontaktist.`];
  const S2 = [
    `<b>8. päev:</b> 3 WhatsAppi staatust uudishimu tekitava sõnumiga (Sõnum 1).`,
    `<b>9. päev:</b> ${cont >= 2 ? "15" : "10"} isiklikku sõnumit Sõnumiga 3. Kirjuta üles, kes vastab.`,
    vid >= 1 ? `<b>10. päev:</b> salvesta stsenaarium 1 «Arva ära, mis see on?»${vid === 1 ? " (ainult käed)" : ""} ja postita ${has("tt") ? "TikTokki, " : ""}Instagrami ja staatusse.` : `<b>10. päev:</b> postita fotokarussell küsimusega «Arva ära, mis see on?».`,
    `<b>11. päev:</b> degusteerimine pere, töökaaslaste või sõpradega. Küsi tagasisidet ja pilti.`,
    has("fb") || cont <= 1 ? `<b>12. päev:</b> postita Marketplace'i ja 3 kohalikku gruppi.` : `<b>12. päev:</b> teine voor staatuses degusteerimise arvamustega.`,
    `<b>13.–14. päev:</b> veel 10 sõnumit ja nädala ülevaade Tellimuste kontrollis.`];
  const S3 = [
    `<b>15. päev:</b> käivita oma <b>«${cajaT}»</b> ${fechaT} jaoks, tellimuste tähtaeg määratud.`,
    `<b>16. päev:</b> lisa WhatsApp Businessi kiirsõnumid ja sildid.`,
    `<b>17. päev:</b> lõpeta lahtised päringud (Sõnumid 12–16). Küsi ettemaksu kinnitamiseks.`,
    `<b>18. päev:</b> loo 3 kohandatud valikut ja arvuta hind.`,
    has("eventos") || A.obj === "eventos" ? `<b>19. päev:</b> võta ühendust 10 potentsiaalse sündmuste või ettevõtete kliendiga (Sõnumid 22 ja 23). <b>Sinu jaoks kõrge prioriteet.</b>` : `<b>19. päev:</b> võta ühendust 5 potentsiaalse sündmuste kliendiga (Sõnum 22).`,
    `<b>20.–21. päev:</b> postita 3 soovitust ja vaata, milline toode toob kõige rohkem kasumit.`];
  const S4 = [
    `<b>22. päev:</b> saada kordusostu sõnum kõigile klientidele (Sõnum 27).`,
    `<b>23. päev:</b> aktiveeri oma soovitusprogramm (Sõnum 28).`,
    has("local") ? `<b>24. päev:</b> külasta 3 partnerettevõtet proovikarbi ja kaasavõtuga. <b>Sinu jaoks kõrge prioriteet.</b>` : `<b>24. päev:</b> võta ühendust 2 seotud ettevõttega (lillepood, kohvik) Sõnumiga 24.`,
    `<b>25. päev:</b> planeeri 2 nädalat sisu${vid >= 1 ? " ja salvesta 3 videot korraga" : ""}.`,
    `<b>26.–27. päev:</b> korda tootmisrutiin ja vaata numbreid kokkuvõttelehel.`,
    `<b>28.–30. päev:</b> lõplik hindamine, tänu klientidele ja uue eesmärgiga plaani koostamine.`];
  const rutina = horas === 0
    ? ["Esmaspäev: 20 min sõnumite ja staatuste jaoks", "Kolmapäev: 20 min sisu tegemiseks", "Laupäev: tootmine ja pakkimine partiidena"]
    : horas === 1 ? ["Iga päev: 15 min staatuste ja vastuste jaoks", "3 päeva nädalas: 30 min plaani ülesandeid", "1 päev: tootmine partiidena"]
    : ["Iga päev: 20 min staatuste ja vastuste jaoks", "Iga päev: plaani ülesanded", "2 päeva: tootmine", "1 päev: mitu videot korraga salvestades"];

  const L = a => `<ul class="list">${a.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  const W = (k, t, d, a) => `<div class="week"><div class="d">${d}</div><h4>${k} · ${t}</h4><ul>${a.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  const hoy = new Date().toLocaleDateString("et", {day:"numeric", month:"long", year:"numeric"});

  $("#plan").innerHTML = `
  <div class="hero"><div class="k">TEGEVUSKAVA · ${hoy.toUpperCase()}</div>
    <h2>${nombre}, see on sinu 30-päevane plaan</h2><p><b>${perfil[0]}.</b> ${perfil[1]}</p>
    <div class="stats"><div class="stat"><b>${fmt(meta)} ${mon}</b><span>sinu eesmärk 30 päevaga</span></div>
    <div class="stat"><b>${minDia}</b><span>päevas · ${diasSem} päeva nädalas</span></div>
    <div class="stat"><b>${prio.length}</b><span>prioriteetsed kanalid</span></div></div></div>

  <div class="sec"><h3><span class="n">1</span>Sinu tugevused</h3>${L(fort)}</div>
  <div class="sec"><h3><span class="n">2</span>Asjad, millele tähelepanu pöörata</h3><ul class="list warn">${aten.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <div class="sec"><h3><span class="n">3</span>Mida müügiga alustada</h3>${L(prods)}
    <div class="note">Soovitatud vormid: <b>${formatos}</b>. Maitsed: <b>${sabores}</b>. Sinu hooaja pakkumine: <b>«${cajaT}»</b>.</div></div>
  <div class="sec"><h3><span class="n">4</span>Kus esmalt müüa</h3><div class="chips">${prio.map(p=>`<span class="chip">${p}</span>`).join("")}</div>
    <div class="note">Alusta esimesest ja lisa järgmine, kui oled järjepidev. Parem üks hästi hoitud kanal kui neli hüljatud.</div></div>
  <div class="sec"><h3><span class="n">5</span>Sinu nädalane rutiin</h3>${L(rutina)}</div>
  <div class="sec"><h3><span class="n">6</span>Sinu plaan nädalate kaupa</h3>
    ${W("Faas 1","Tegevuskava","1.–7. PÄEV",S1)}${W("Faas 2","Esimesed kliendid","8.–14. PÄEV",S2)}
    ${W("Faas 3","Päringud → tellimused","15.–21. PÄEV",S3)}${W("Faas 4","Kasvamine","22.–30. PÄEV",S4)}</div>
  <div class="note"><b>Sinu eesmärk on juhend, mitte garantii.</b> Tulemused sõltuvad sinu järjepidevusest, hindadest ja turust. Kui lehel «3 · Eesmärk» päevased numbrid tunduvad sinu ajaga võimatud, kohanda eesmärki: saavutatav eesmärk on parem kui suur, mida ei täideta. Iga ülesanne on põhjalikult selgitatud <b>programmi käsiraamatus</b>.</div>
  <div class="actions"><button class="print" type="button" onclick="window.print()">⬇ Salvesta PDF-ina / Prindi</button>
  <button class="restart" type="button" onclick="restart()">Muuda vastuseid</button></div>`;
  $("#quiz").style.display = "none"; $("header .sub").style.display = "none";
  $("#plan").style.display = "block"; window.scrollTo(0, 0);
  A.done = true; save();
}
function restart() { $("#plan").style.display = "none"; $("#quiz").style.display = "block"; $("header .sub").style.display = ""; i = 0; render(); }
if (A.done && A.meta) showPlan(); else render();
</script>
</body>
</html>
